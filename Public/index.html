<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff4f87">
<title>Us vs Us 2.1 ❤️</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:linear-gradient(135deg,#fff0f6,#f3edff);
color:#34253b;
min-height:100vh
}

main{
max-width:760px;
margin:auto;
padding:16px
}

.box{
background:#ffffffdf;
backdrop-filter:blur(12px);
border-radius:28px;
padding:24px;
box-shadow:0 20px 60px #6b426422;
margin-top:16px;
text-align:center
}

h1{
font-size:42px;
margin:5px 0 12px
}

h1 span{
color:#ff4f87
}

input{
padding:15px;
border:2px solid #efdce8;
border-radius:14px;
width:100%;
font-size:17px;
margin:7px 0
}

button{
border:0;
border-radius:14px;
padding:14px 18px;
font-weight:850;
cursor:pointer;
margin:5px;
background:#34253b;
color:#fff;
font-size:15px
}

button:disabled{
opacity:.45
}

.pink{
background:linear-gradient(135deg,#ff4f87,#a86cff)
}

.share{
background:#fff;
color:#34253b;
border:2px solid #ead8e5
}

.row{
display:flex;
gap:10px
}

.row>*{
flex:1
}

.hidden{
display:none!important
}

.code{
font-size:38px;
letter-spacing:8px;
font-weight:950;
color:#ff4f87
}

.smallcode{
font-size:22px;
letter-spacing:4px;
font-weight:900
}

.status{
font-weight:850;
margin:12px
}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:16px 0
}

.player{
padding:14px;
border-radius:18px;
background:#fff4f8
}

.player:nth-child(2){
background:#f5f0ff
}

.score{
font-size:34px;
font-weight:950
}

.card{
margin:18px 0;
padding:28px;
border:2px solid #f2dce8;
border-radius:22px;
min-height:230px;
display:flex;
flex-direction:column;
justify-content:center
}

.cat{
font-weight:950;
color:#d83c70
}

.challenge{
font-size:27px;
font-weight:950;
margin:15px 0
}

.muted{
color:#806d7e
}

.actions{
display:flex;
flex-wrap:wrap;
justify-content:center
}

.connection{
font-size:13px;
margin-top:8px
}

.toast{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#34253b;
color:#fff;
padding:12px 16px;
border-radius:14px;
opacity:0;
transition:.25s;
z-index:5
}

.toast.show{
opacity:1
}

@media(max-width:600px){
.row{
flex-direction:column
}

.challenge{
font-size:23px
}

.code{
font-size:32px;
letter-spacing:6px
}
}
</style>
</head>

<body>

<main>

<!-- HOME -->
<section class="box" id="home">

<div style="font-size:60px">💑</div>

<h1>
Us <span>vs</span> Us 2.1
</h1>

<p>
Two phones • one room • real-time couple chaos ❤️
</p>

<input
id="name"
maxlength="30"
placeholder="Your name"
>

<div class="row">

<button
class="pink"
onclick="createRoom()">
Create Room
</button>

<button
onclick="showJoin()">
Join Room
</button>

</div>

<div id="joinBox" class="hidden">

<input
id="codeInput"
maxlength="5"
placeholder="5-letter room code"
>

<button
class="pink"
onclick="joinRoom()">
Join ❤️
</button>

</div>

</section>


<!-- LOBBY -->
<section
class="box hidden"
id="lobby">

<div class="muted">
ROOM CODE
</div>

<div
class="code"
id="roomCode">
-----
</div>

<button
class="share"
onclick="copyCode()">
📋 Copy Code
</button>

<button
class="share"
onclick="shareRoom()">
📤 Share Room
</button>

<div
class="status"
id="lobbyStatus">
Waiting for your partner…
</div>

<div id="lobbyPlayers"></div>

</section>


<!-- GAME -->
<section
class="box hidden"
id="game">

<div class="muted">
ROOM
<span
class="smallcode"
id="gameCode">
</span>
</div>


<div class="players">

<div class="player">

<b id="n0"></b>

<div
class="score"
id="s0">
0
</div>

<div id="p0"></div>

</div>


<div class="player">

<b id="n1"></b>

<div
class="score"
id="s1">
0
</div>

<div id="p1"></div>

</div>

</div>


<div
class="status"
id="turn">
</div>


<!-- NEW TURN BUTTON -->
<button
id="claim"
class="share hidden"
onclick="claimTurn()">
🙋 It's My Turn
</button>


<div class="card">

<div
class="cat"
id="cat">
READY
</div>

<div
class="challenge"
id="ch">
When it is your turn, choose a challenge.
</div>

<div
class="muted"
id="pts">
</div>

</div>


<div class="actions">

<button
class="pink"
id="randomBtn"
onclick="randomChallenge()">
🎲 Random Challenge
</button>

<button
class="pink hidden"
id="doneBtn"
onclick="completeChallenge()">
✓ Completed!
</button>

<button
class="hidden"
id="skipBtn"
onclick="skipChallenge()">
😂 Skip
</button>

<button
class="share"
onclick="copyCode()">
📋 Copy Code
</button>

</div>


<div
class="connection"
id="conn">
</div>

</section>

</main>


<div
class="toast"
id="toast">
</div>


<script>

const challenges=[

["❤️ ROMANCE",
"Tell your partner one thing you genuinely love about them.",
2],

["😂 FUNNY",
"Imitate your partner for 20 seconds.",
3],

["🎨 CREATIVE",
"Invent a ridiculous business you could start together.",
3],

["🔥 WHO IS MORE LIKELY?",
"Who would spend €500 on something unnecessary? Both point at someone!",
2],

["💋 COUPLE",
"Look into each other's eyes for 30 seconds without laughing.",
3],

["😂 FUNNY",
"Pretend you are meeting for the first time and flirt with each other.",
3],

["❤️ ROMANCE",
"Describe your perfect date together in 20 seconds.",
3],

["🎨 CREATIVE",
"Design your couple superhero and give them a superpower.",
3],

["🃏 CHAOS",
"Lovingly roast your partner for 30 seconds.",
3],

["💋 COUPLE",
"Recreate your first date using only five words.",
3],

["❤️ ROMANCE",
"Name your favourite memory together and explain why.",
2],

["😂 FUNNY",
"Give a dramatic movie-trailer voice-over about your relationship.",
3],

["🃏 CHAOS",
"KISS TAX! Give your partner a kiss before continuing. ❤️",
2]

];


let ws=null;
let me=null;
let turn=0;
let current=null;
let roomCode='';
let players=[];

let reconnectTimer=null;


function $(x){
return document.getElementById(x);
}


function toast(t){

$('toast').textContent=t;

$('toast').classList.add('show');

setTimeout(
()=>$('toast').classList.remove('show'),
2200
);

}


function setConn(t){

$('conn').textContent=
t
?'🟢 Connected'
:'🟠 Reconnecting…';

}


function connect(open){

if(
ws &&
(ws.readyState===1 ||
ws.readyState===0)
)
return;


const p=
location.protocol==='https:'
?'wss'
:'ws';


ws=
new WebSocket(
p+'://'+location.host
);


ws.onopen=()=>{

setConn(true);

open?.();

};


ws.onclose=()=>{

setConn(false);


if(
roomCode &&
!reconnectTimer
){

reconnectTimer=
setTimeout(
()=>{
reconnectTimer=null;
rejoin();
},
1200
);

}

};


ws.onmessage=e=>{

handle(
JSON.parse(e.data)
);

};

}


function save(){

localStorage.setItem(
'usvsus21',
JSON.stringify({

roomCode,

playerId:
ws?.pid,

name:
$('name').value,

slot:
me

})
);

}


function rejoin(){

const x=
JSON.parse(
localStorage.getItem(
'usvsus21'
)||'null'
);


if(x?.roomCode){

connect(
()=>ws.send(
JSON.stringify({

type:'join',

code:
x.roomCode,

playerId:
x.playerId,

name:
x.name||'Player'

})
)
);

}

}


function createRoom(){

connect(
()=>ws.send(
JSON.stringify({

type:'create',

name:
$('name').value.trim()
||'Player 1'

})
)
);

}


function showJoin(){

$('joinBox')
.classList.remove('hidden');

}


function joinRoom(){

const c=
$('codeInput')
.value
.replace(/\s/g,'')
.toUpperCase();


if(c.length!==5){

return toast(
'Enter the 5-letter room code.'
);

}


connect(
()=>ws.send(
JSON.stringify({

type:'join',

code:c,

name:
$('name').value.trim()
||'Player 2'

})
)
);

}


function handle(m){

if(m.type==='error'){

return toast(m.message);

}


if(
m.type==='room' ||
m.type==='joined'
){

roomCode=m.code;

me=m.slot;

players=m.players;

turn=m.turn??0;

ws.pid=m.playerId;

save();


$('home')
.classList.add('hidden');

$('roomCode')
.textContent=roomCode;

$('gameCode')
.textContent=roomCode;

$('lobby')
.classList.remove('hidden');


renderLobby();

render();

}


if(
m.type==='state' ||
m.type==='presence'
){

players=m.players;

turn=m.turn??turn;

current=
m.challenge??null;


renderLobby();

render();


if(
players.length===2 &&
players.every(p=>p.connected)
){

startGame();

}

}


if(m.type==='challenge'){

current=m.challenge;

turn=m.turn;

showChallenge();

}


if(m.type==='ready'){

startGame();

}


if(m.type==='winner'){

alert(
'🏆 '+
players[m.player].name+
' wins 50 Love Points! ❤️'
);

}

}


function renderLobby(){

$('lobbyPlayers')
.innerHTML=
players
.map(
p=>
'❤️ '+
p.name+
' — '+
(
p.connected
?'🟢 Online'
:'🟠 Reconnecting…'
)
)
.join('<br>');


$('lobbyStatus')
.textContent=

players.length<2

?'⏳ Waiting for your partner…'

:

players.every(p=>p.connected)

?'❤️ Both connected!'

:'🟠 Connecting both players…';

}


function render(){

$('n0').textContent=
players[0]?.name||
'Player 1';

$('s0').textContent=
players[0]?.score||
0;

$('n1').textContent=
players[1]?.name||
'Player 2';

$('s1').textContent=
players[1]?.score||
0;


$('p0').textContent=
players[0]?.connected
?'🟢 Online'
:'🟠 Offline';


$('p1').textContent=
players[1]?.connected
?'🟢 Online'
:'🟠 Offline';


$('turn').textContent=

turn===me

?'🔥 YOUR TURN'

:'⏳ '+
(
players[turn]?.name||
'Partner'
)+
"'s turn";


$('claim')
.classList.toggle(
'hidden',

turn===me ||
players.length<2 ||
!players.every(p=>p.connected)

);

}


function startGame(){

$('lobby')
.classList.add('hidden');

$('game')
.classList.remove('hidden');


render();


if(current){

showChallenge();

}else{

showReady();

}

}


function claimTurn(){

ws.send(
JSON.stringify({
type:'claimTurn'
})
);

}


function randomChallenge(){

if(turn!==me){

return toast(
"Wait for your turn ❤️"
);

}


current=
challenges[
Math.floor(
Math.random()*
challenges.length
)
];


ws.send(
JSON.stringify({

type:'challenge',

challenge:current

})
);

}


function showChallenge(){

$('cat').textContent=
current[0];

$('ch').textContent=
current[1];

$('pts').textContent=
'+'+
current[2]+
' Love Points ❤️';


$('randomBtn')
.classList.add('hidden');

$('doneBtn')
.classList.remove('hidden');

$('skipBtn')
.classList.remove('hidden');


render();

}


function completeChallenge(){

if(
turn!==me ||
!current
)return;


ws.send(
JSON.stringify({

type:'score',

points:current[2]

})
);

}


function skipChallenge(){

if(turn!==me)
return;


ws.send(
JSON.stringify({

type:'score',

points:0

})
);

}


function showReady(){

$('cat').textContent=
'READY';

$('ch').textContent=
'Tap Random Challenge when it is your turn!';

$('pts').textContent='';


$('randomBtn')
.classList.remove('hidden');

$('doneBtn')
.classList.add('hidden');

$('skipBtn')
.classList.add('hidden');


render();

}


async function copyCode(){

try{

await navigator.clipboard
.writeText(roomCode);

toast(
'Copied: '+roomCode
);

}catch{

toast(
'Room code: '+roomCode
);

}

}


async function shareRoom(){

const text=
'Join my Us vs Us ❤️ game! Room code: '+
roomCode+
'\n'+
location.href;


if(navigator.share){

try{

await navigator.share({

title:
'Us vs Us 2.1 ❤️',

text

});

}catch{}

}else{

try{

await navigator.clipboard
.writeText(text);

toast(
'Invite copied ❤️'
);

}catch{

toast(text);

}

}

}


window.addEventListener(
'load',
()=>{

const x=
JSON.parse(
localStorage.getItem(
'usvsus21'
)||'null'
);


if(x?.roomCode){

$('name').value=
x.name||'';

$('codeInput').value=
x.roomCode;

$('joinBox')
.classList.remove('hidden');

}

}
);

</script>

</body>
</html>
